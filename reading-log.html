<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find my Spine</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- <script src="script.js" defer></script> -->
    <script src="log.js" defer></script>
</head>

<body>
    <div class="d-flex">


        <!-- nav bar -->
        <div class="p-3  col-25" id="navbar-section">

            <div class="d-flex flex-column h-100">

                <!-- top  -->
                <div>
                    <div class="text-center h3 pb-1 pt-2 fw-bold">
                        <i class="bi bi-book"></i> Find my Spine
                    </div>
                    <hr>
                </div>

                <!-- mid -->
                <div class="d-flex flex-column" id="nav-links">
                    <div class="link-box  p-3 mt-3">
                        <a class="text-decoration-none link-dark  mt-5 mb-4 h5" href="index.html"><i
                                class="bi bi-house-heart"></i> <span id="nav-text">Home</span></a>
                    </div>
                    <div class="link-box  p-3 mt-3">
                        <a class="text-decoration-none link-dark  mt-5 mb-4 h5" href="reading-list.html"><i
                                class="bi bi-list-stars"></i>  <span id="nav-text">Reading List</span></a>
                    </div>
                    <div class="link-box  mt-3 p-3 mb-5 ">
                        <a class="text-decoration-none link-dark  mt-5 mb-4 h5" href="reading-log.html"><i
                                class="bi bi-bookmark-heart"></i> <span id="nav-text">Reading Log</span></a>
                    </div>


                </div>

                <!--bottom  -->
                <div style="height: auto;" class="mt-5">
                    <div class="logo-img ">
                        <img src="lokgo (1).png" alt="">
                    </div>
                    <hr>

                </div>

            </div>
        </div>

        <div id="main-section" class="col-9">

            <div id="main-header" class="d-flex">

                <div class="col-5">

                    <h1 class="fw-bolder hover-underline mb-3">Reading Log</h1>
                    <h4 class="fw-bold light-text">Log your finished books!</h4>


                </div>
               
            </div>




            <div class="bg-brown p-3" id="log-box">
                <h4 class="mb-4 pt-2 h3 light-text fw-bolder underline">Add to Log</h4>


                <form action="submit" id="log-form">
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label hover-underline">Book Name: </label>
                            <input type="text" class="form-control text-dark "
                                placeholder="e.g. The Adventures of Leia Pala" id="name-input" name="name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label hover-underline">Author Name: </label>
                            <input type="tel" class="form-control text-dark " placeholder="e.g. Rithika Ranjth"
                                id="author-input" name="name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label hover-underline">Rating: </label>
                            <div class="star-rating justify-content-end" id="star-rating" required>
                                 <input type="radio" value="6" id="6-star">
                                <label for="6-star" class="pt-0">★</label>

                                <input type="radio" value="5" id="5-star">
                                <label for="5-star" class="pt-0">★</label>

                                <input type="radio" value="4" id="4-star">
                                <label for="4-star" class="pt-0">★</label>

                                <input type="radio" value="3" id="3-star">
                                <label for="3-star" class="pt-0">★</label>

                                <input type="radio" value="2" id="2-star">
                                <label for="2-star" class="pt-0">★</label>

                                <input type="radio" value="1" id="1-star">
                                <label for="1-star" class="pt-0">★</label>
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label hover-underline">Finish Date: </label>
                            <input type="date" class="form-control text-dark " id="finish-date" name="name" required>
                        </div>

                        <div class=" mb-3">
                            <label for="name" class="form-label hover-underline">Notes: </label>
                            <textarea type="text" class="form-control text-dark pb-5"
                                placeholder="Leia Pala's adventures consist of her jumping in muddy puddles and playing with racecars. Quite boring 🥱🤭"
                                id="notes-input" name="name" required></textarea>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn">
                        Log it!
                    </button>

                </form>



            </div>
             <h4 class="pt-2 h3 pb-0 mb-0 light-text fw-bolder hover-underline">Your Reading Log</h4>
            <h4 class="fw-bold h6 mt-2 lighter-text">Right click your logs to delete</h4>

            <div id="log-history" class="text-center">
                <div class="text-center">
                    <div id="noBooks">
                        <p class="pt-5 pb-2 h4">No Book Logs Yet!</p>
                        <div class="btn-genre  pb-5">
                            <a href="index.html">Get to reading!</a>
                        </div>

                        
                    </div>
                    <table id="logs-table" class="hidden">
                        <tr class="h4">
                            <th class="px-5">Rating</th>
                            <th class="px-5">Book Name</th>
                            <th class="px-5">Author</th>
                            <th class="px-5">Date</th>
                            <th class="px-5">Notes</th>
                        </tr>
                        <br>
                        
                        <!-- use js to add tr, and td inside -->
                       
                    </table>
                </div>
            </div>
        </div>

      

    </div>
    <!-- buttons -->

    </div>


    <!-- footer -->
    <footer class=" mb-0 mt-0 d-flex flex-wrap justify-content-between align-items-center py-3 my-4" id="footer">
        <p class="col-md-4 ps-4 mb-0 text-body-secondary"> ©Find my Spine</p>
        <a href="/"
            class="col-md-4 d-flex align-items-center justify-content-center link-body-emphasis text-decoration-none"
            aria-label="footer">
            <svg class="bi me-2" width="40" height="32" aria-hidden="true">
                <use xlink:href=" #bootstrap"></use>
            </svg>
        </a>
        <ul class="nav col-md-4 justify-content-end" id="footer-links">
            <li class="nav-item"><a href="index.html" class="nav-link px-2 text-body-secondary">Home</a></li>
            <li class="nav-item"><a href="reading-list.html" class="nav-link px-2 text-body-secondary">Reading List</a>
            </li>
            <li class="nav-item"><a href="reading-log.html" class="nav-link px-2 text-body-secondary">Reading Log</a>
            </li>
        </ul>
    </footer>


</body>

</html>
